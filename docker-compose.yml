services:
  balanceador:
    image: nginx:1.27
    container_name: ingressos-balanceador
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

  app1:
    image: traefik/whoami
    container_name: ingressos-app1
    depends_on:
      - db

  app2:
    image: traefik/whoami
    container_name: ingressos-app2
    depends_on:
      - db
  
  db:
    image: postgres:16
    container_name: ingressos-db
    environment:
      POSTGRES_DB: ingressos
      POSTGRES_USER: ingressos
      POSTGRES_PASSWORD: ingressos
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  dados:
